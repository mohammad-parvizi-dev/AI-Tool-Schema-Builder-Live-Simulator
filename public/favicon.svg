<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tradeGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Accent -->
  <line x1="16" y1="48" x2="48" y2="48" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="16" y1="36" x2="48" y2="36" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Candlestick / Trading Chart Graphic -->
  <!-- Candle 1 (Green/Cyan) -->
  <line x1="20" y1="26" x2="20" y2="44" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <rect x="17.5" y="30" width="5" height="10" rx="1.5" fill="#10b981" />

  <!-- Candle 2 (High Spike) -->
  <line x1="30" y1="16" x2="30" y2="42" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <rect x="27.5" y="20" width="5" height="14" rx="1.5" fill="#38bdf8" />

  <!-- Lightning / AI Spark Bolt overlay -->
  <path d="M44 14L32 30H41L35 48L49 28H40L44 14Z" fill="url(#tradeGrad)" filter="url(#glow)" stroke="#60a5fa" stroke-width="1" stroke-linejoin="round" />

  <!-- Small AI Node Dots -->
  <circle cx="16" cy="18" r="2.5" fill="#60a5fa" />
  <circle cx="50" cy="46" r="2" fill="#34d399" />
</svg>
